    <script>
        // 設定專屬的冠軍配色 (Champion Palette) 與深色模式
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        champ: {
                            darkest: '#020617', // Sidebar & Header 背景
                            dark: '#0f172a',    // Dark mode 主背景
                            cardDark: '#1e293b',// Dark mode 卡片背景
                            light: '#f8fafc',   // Light mode 主背景
                            primary: '#3b82f6', // 主要藍色
                            accent: '#06b6d4',  // 青色點綴

                        }
                    }
                }
            }
        }

        .rotate-y-180 { transform: rotateY(180deg); }
        .group:hover .group-hover\:rotate-y-180 { transform: rotateY(180deg); }
        
        /* 捲動條樣式優化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        audio::-webkit-media-controls-panel {

        }
        .dark audio::-webkit-media-controls-panel {

        let lang = 'zh';

        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-text').innerText = lang === 'zh' ? 'EN / 中文' : '中文 / EN';
            updateContent();
            document.getElementById('quiz-result').classList.add('hidden');
        }

        function updateContent() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerHTML = translations[lang][key];
            });
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').innerText = isDarkMode ? '☀️' : '🌙';
        }

        function playAudio() {
            const t = (key) => translations[lang][key] || key;
            const textToSpeak = lang === 'zh' 
                ? `歡迎瀏覽鴻海企業策略分析網頁。本專案由第五小組製作。${t('hero_motivation')}` 
                : `Welcome to Foxconn Strategic Analysis. Project by Group 5. ${t('hero_motivation')}`;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = lang === 'zh' ? 'zh-TW' : 'en-GB';
            const voices = window.speechSynthesis.getVoices();
            if (lang === 'en') {
                utterance.voice = voices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('male')) || voices.find(v => v.lang === 'en-GB');
            } else {
                utterance.voice = voices.find(v => v.lang === 'zh-TW' && v.name.toLowerCase().includes('yating')) || voices.find(v => v.lang === 'zh-TW');
            }
            window.speechSynthesis.speak(utterance);
        }

        // Quiz inputs
        document.querySelectorAll('input[name="q1"]').forEach(el => el.addEventListener('change', (e) => answers.q1 = e.target.value));
        document.querySelectorAll('input[name="q2"]').forEach(el => el.addEventListener('change', (e) => answers.q2 = e.target.value));

        function handleQuizSubmit() {
            const resultDiv = document.getElementById('quiz-result');
            resultDiv.classList.remove('hidden');
            if (answers.q1 === 'b' && answers.q2 === 'b') {
                resultDiv.className = 'mt-6 p-4 rounded-xl text-center font-bold text-lg bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-400 block';

            } else {
                resultDiv.className = 'mt-6 p-4 rounded-xl text-center font-bold text-lg bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-400 block';
                resultDiv.innerText = translations[lang]['quiz_wrong'];
            }
        }

        const mobileBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        function toggleMobileSidebar() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
        mobileBtn.addEventListener('click', toggleMobileSidebar);
        overlay.addEventListener('click', toggleMobileSidebar);

        function handleRouting() {
            const hash = window.location.hash || '#home';
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.toggle('hidden', '#' + sec.id !== hash));
            
            // Sidebar Active UI
            document.querySelectorAll('.sidebar-link').forEach(link => {
                const isActive = '#' + link.dataset.page === hash;
                link.classList.toggle('bg-slate-800', isActive);
                link.classList.toggle('text-champ-accent', isActive);
                const dot = link.querySelector('span:first-child');
                if (dot) dot.classList.toggle('bg-champ-primary', isActive);
                if (dot) dot.classList.toggle('bg-slate-600', !isActive);
            });

            document.querySelector('main').scrollTo(0, 0);
            if(window.innerWidth < 768) sidebar.classList.add('-translate-x-full'), overlay.classList.add('hidden');
        }

        window.addEventListener('hashchange', handleRouting);
        window.onload = () => { 
            updateContent(); 
            handleRouting(); 
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
